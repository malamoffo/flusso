name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update version in package.json
        run: |
          VERSION=${{ github.event.inputs.version }}
          VERSION=${VERSION#v}
          npm version $VERSION --no-git-tag-version

      - name: Build Web App
        run: |
          VERSION=${{ github.event.inputs.version }}
          VERSION=${VERSION#v}
          VITE_APP_VERSION=$VERSION VITE_APP_BUILD=${{ github.run_number }} npm run build

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '8.14.5'
          cache-read-only: false
          build-scan-publish: false

      - name: Sync Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using provided secret release keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating production release keystore for secure signed APK..."
            keytool -genkey -v -keystore android/app/release.keystore \
              -alias flusso_release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "flusso_safe_keystore_2026" -keypass "flusso_safe_keystore_2026" \
              -dname "CN=Flusso, OU=Mobile, O=Flusso Team, L=Rome, ST=RM, C=IT"
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASS=flusso_safe_keystore_2026" >> $GITHUB_ENV
            echo "KEY_ALIAS=flusso_release" >> $GITHUB_ENV
            echo "KEY_PASS=flusso_safe_keystore_2026" >> $GITHUB_ENV
          fi

      - name: Build Android Release APK
        run: |
          cd android
          gradle clean
          gradle assembleRelease --build-cache
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.KEY_PASS }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}